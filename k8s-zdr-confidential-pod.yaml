apiVersion: apps/v1
kind: Deployment
metadata:
  name: zdr-enclave-gateway
  namespace: private-intelligence
  labels:
    app: zdr-gateway
    security.openai.com/enclave: amd_sev_snp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: zdr-gateway
  template:
    metadata:
      labels:
        app: zdr-gateway
    spec:
      nodeSelector:
        node.kubernetes.io/instance-type: "c6a.metal"
        security.hardware/confidential-compute: "true"
      containers:
        - name: enclave-gateway
          image: ghcr.io/pradeeptalari14/private-intelligence-zdr:latest
          command: ["python3", "zdr_enclave_gateway.py"]
          resources:
            limits:
              memory: 4Gi
              cpu: "4"
            requests:
              memory: 1Gi
              cpu: "1"
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: ephemeral-shm
              mountPath: /dev/shm
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: ephemeral-shm
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
